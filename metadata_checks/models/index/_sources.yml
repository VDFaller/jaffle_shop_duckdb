version: 2

sources:
  - name: dbt_index
    description: Parquet metadata index generated by Fusion `dbt compile --write-index`.
    tables:
      - name: nodes
        description: Parsed dbt resources from the indexed project.
        config:
          external_location: "read_parquet('{{ var('metadata_index_dir') }}/dbt.nodes.parquet')"
      - name: node_columns
        description: Column metadata for indexed dbt resources.
        config:
          external_location: "read_parquet('{{ var('metadata_index_dir') }}/dbt.node_columns.parquet')"
      - name: test_metadata
        description: Normalized metadata for indexed dbt tests.
        config:
          external_location: "read_parquet('{{ var('metadata_index_dir') }}/dbt.test_metadata.parquet')"
